name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build and run hardware-free checks
        run: make check
      - name: Check the Homebrew formula
        run: ruby -c Formula/dockctl.rb
      - name: Package CLI and library
        run: scripts/package.sh "dev-${GITHUB_SHA:0:7}"
      - uses: actions/upload-artifact@v4
        with:
          name: dockctl-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
